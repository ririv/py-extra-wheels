name: Build wheels from recipes

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'scripts/recipes/**'
      - 'scripts/__init__.py'
      - 'scripts/build/**'
      - 'scripts/pipeline/**'
      - '.github/actions/**'
      - 'scripts/tooling.py'
      - 'pyproject.toml'
      - 'build-compatibility.toml'
      - '!scripts/pipeline/publish.py'
      - '!scripts/pipeline/notifications.py'
      - '!.github/actions/publish-wheels/**'
      - '!scripts/**/tests/**'
      - '!scripts/**/*.pyc'
      - '.github/workflows/build-wheels.yml'
      - '.github/workflows/build-android-wheel-dispatch.yml'
      - '.github/workflows/build-wheel-batch.yml'
  workflow_dispatch:
    inputs:
      recipes:
        description: 'Recipe names separated by commas, or all'
        required: true
        type: string
        default: 'pydantic-core'
      python_versions:
        description: 'recipe uses TOML defaults; otherwise comma-separated versions such as 3.10,3.13'
        required: true
        type: string
        default: 'recipe'
      version_tag:
        description: 'Override Git ref for a single selected recipe'
        required: false
        type: string
      publication:
        description: 'publish updates the wheel index; build keeps artifacts in Actions only'
        required: true
        type: choice
        options: [publish, build]
        default: publish
      rebuild:
        description: 'changed reuses verified published wheels; force rebuilds selected targets'
        required: true
        type: choice
        options: [changed, force]
        default: changed

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
      has_reused: ${{ steps.plan.outputs.has_reused }}
      publication: ${{ steps.plan.outputs.publication }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: Read published build receipts without downloading wheels
        uses: actions/checkout@v4
        with:
          ref: wheels
          path: wheel-store
          sparse-checkout: .build-records
          persist-credentials: false
      - name: Plan pinned independent targets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -m scripts.pipeline plan --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --published-store wheel-store --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: build-plan.json
          if-no-files-found: error

  build:
    name: Batch ${{ matrix.batch }}
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-wheel-batch.yml
    with:
      batch: ${{ matrix.batch }}

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publication == 'publish' && needs.plan.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/publish-wheels

  sync-index:
    needs: plan
    if: needs.plan.outputs.publication == 'publish' && needs.plan.outputs.has_jobs == 'false' && needs.plan.outputs.has_reused == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: Ensure reused wheels are indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -m scripts.pipeline notify-index --repository "$GITHUB_REPOSITORY"
